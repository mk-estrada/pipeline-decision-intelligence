rev_forecasting:
  target: dev
  outputs:
    dev:
      type: snowflake
      account: OBB73126.us-west-2

      # User/password auth
      user: "{{ env_var('SNOWFLAKE_USERNAME') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD') }}"

      role: ACCOUNTADMIN
      database: REV_FORECASTING
      warehouse: REV_FORECASTING_WH
      schema: ANALYTICS
      threads: 4
      client_session_keep_alive: false